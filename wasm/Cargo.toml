[package]
name = "crisp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Crisp web client's engine: crisp-core plus the spargen-generated API client, compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crisp-core = { workspace = true, features = ["ts"] }
console_error_panic_hook = "0.1"
js-sys = "0.3.107"
serde.workspace = true
serde-wasm-bindgen = "0.6"
serde_bytes.workspace = true
serde_json.workspace = true
tsify = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

# The spargen runtime contract: exactly these, at these floors.
bytes = "1.12.1"
http = "1.4.2"
http-body = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
secrecy = "0.10.3"

[build-dependencies]
spargen = "0.7.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"

# `tests/server.rs` serves the real crisp-server router on an ephemeral port
# and drives the generated client against it; it reuses the server's
# in-memory `MockStorage` (`server/tests/common`), which needs the rest.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
crisp-server = { path = "../server" }
async-trait = "0.1"
hex = "0.4"
# crisp-server's own kynos features (`server/Cargo.toml`) plus `test-util`:
# a default-features kynos here would unify `http2` into the workspace build.
kynos = { version = "0.6.1", default-features = false, features = [
    "openapi32",
    "macros",
    "server",
    "http1",
    "json",
    "trace",
    "test-util",
] }
sea-orm = { version = "2.0.4", default-features = false }
tokio.workspace = true
