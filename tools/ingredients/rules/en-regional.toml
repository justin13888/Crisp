# Culinary terms that differ across US, British, and Canadian English.
#
# Applied to every English name as whole-word, case-insensitive phrase
# rewriting (a plural -s/-es is kept). A regional shard receives a name only
# where the rewrite differs from US English. Add a term only when the regions
# name the SAME ingredient differently; terms whose meaning shifts by region
# (biscuit/cookie, prawn/shrimp, corn flour, double/heavy cream) are
# deliberately absent. A rewrite never takes a spelling another entry owns in
# the source, so the lexicon renames terms but never merges entries.

[[term]]
us = "eggplant"
gb = "aubergine"
ca = "eggplant"

