# ---- locales ----------------------------------------------------------------

[locales]
# Region-qualified shards. Never a bare language: regions name ingredients
# differently.
shards = [
  "en-US", "en-GB", "en-CA",
  "zh-Hans-CN", "zh-Hant-TW", "zh-Hant-HK",
  "ja-JP", "ko-KR", "vi-VN", "th-TH",
  "fr-FR", "it-IT", "es-ES", "de-DE", "pt-PT", "el-GR",
]
last_resort = ["en-US", "en-GB", "en-CA"]
english_lexicon = "en-regional.toml"
english = { us = "en-US", gb = "en-GB", ca = "en-CA" }

# Each OFF language fills its default shard.
[locales.off_language]
en = "en-US"
zh = "zh-Hans-CN"
ja = "ja-JP"
ko = "ko-KR"
vi = "vi-VN"
th = "th-TH"
fr = "fr-FR"
it = "it-IT"
es = "es-ES"
de = "de-DE"
pt = "pt-PT"
el = "el-GR"

# After an exact shard match, a tag (then each truncation of it) tries these
# shards in order; then the language's other shards; then last_resort.
[locales.fallback]
"en" = ["en-US", "en-GB", "en-CA"]
"en-ca" = ["en-US", "en-GB"]
"en-au" = ["en-GB", "en-US"]
"en-nz" = ["en-GB", "en-US"]
"en-ie" = ["en-GB", "en-US"]
"en-za" = ["en-GB", "en-US"]
"en-in" = ["en-GB", "en-US"]
"en-sg" = ["en-GB", "en-US"]
"zh" = ["zh-Hans-CN", "zh-Hant-TW", "zh-Hant-HK"]
"zh-cn" = ["zh-Hans-CN"]
"zh-sg" = ["zh-Hans-CN"]
"zh-my" = ["zh-Hans-CN"]
"zh-hans" = ["zh-Hans-CN"]
"zh-hant" = ["zh-Hant-TW", "zh-Hant-HK"]
"zh-tw" = ["zh-Hant-TW", "zh-Hant-HK"]
"zh-hk" = ["zh-Hant-HK", "zh-Hant-TW"]
"zh-mo" = ["zh-Hant-HK", "zh-Hant-TW"]
"zh-hant-mo" = ["zh-Hant-HK", "zh-Hant-TW"]
"yue" = ["zh-Hant-HK", "zh-Hant-TW"]
"pt-br" = ["pt-PT"]

# OFF `zh` mixes scripts: normalize it to Simplified in place, then derive the
# Traditional regional shards from it (OpenCC s2twp / s2hk without the
# generated regional phrase table).
[[locales.derive]]
shard = "zh-Hans-CN"
from = "zh-Hans-CN"
stages = [["TSPhrases", "TSCharacters"]]

[[locales.derive]]
shard = "zh-Hant-TW"
from = "zh-Hans-CN"
stages = [["STPhrases", "STCharacters"], ["TWPhrases"], ["TWVariantsPhrases", "TWVariants"]]

[[locales.derive]]
shard = "zh-Hant-HK"
from = "zh-Hans-CN"
stages = [["STPhrases", "STCharacters"], ["HKVariantsPhrases", "HKVariants"]]

# ---- selection --------------------------------------------------------------

# Culinary subtrees of the OFF taxonomy and their Crisp category. An entry
# takes the category of the deepest included root above it.
[select]
include = [
  { id = "en:vegetable", category = "produce" },
  { id = "en:fruit", category = "produce" },
  { id = "en:mushroom", category = "produce" },
  { id = "en:algae", category = "produce" },
  { id = "en:legume", category = "legume" },
  { id = "en:soya", category = "legume" },
  { id = "en:tofu", category = "legume" },
  { id = "en:herb", category = "herb" },
  { id = "en:spice", category = "spice" },
  { id = "en:pepper", category = "spice" },
  { id = "en:condiment", category = "condiment" },
  { id = "en:sauce", category = "condiment" },
  { id = "en:vinegar", category = "condiment" },
  { id = "en:mustard", category = "condiment" },
  { id = "en:salt", category = "seasoning" },
  { id = "en:dairy", category = "dairy" },
  { id = "en:egg", category = "egg" },
  { id = "en:cereal", category = "grain" },
  { id = "en:rice", category = "grain" },
  { id = "en:quinoa", category = "grain" },
  { id = "en:dough", category = "grain" },
  { id = "en:vermicelli", category = "grain" },
  { id = "en:flour", category = "baking" },
  { id = "en:starch", category = "baking" },
  { id = "en:yeast", category = "baking" },
  { id = "en:gelatin", category = "baking" },
  { id = "en:chocolate", category = "baking" },
  { id = "en:cocoa", category = "baking" },
  { id = "en:bread", category = "bakery" },
  { id = "en:biscuit", category = "bakery" },
  { id = "en:meat", category = "meat" },
  { id = "en:poultry", category = "meat" },
  { id = "en:animal", category = "meat" },
  { id = "en:fish", category = "seafood" },
  { id = "en:shellfish", category = "seafood" },
  { id = "en:oil-and-fat", category = "fat" },
  { id = "en:margarine", category = "fat" },
  { id = "en:nut", category = "nut-seed" },
  { id = "en:seed", category = "nut-seed" },
  { id = "en:added-sugar", category = "sweetener" },
  { id = "en:jam", category = "sweetener" },
  { id = "en:broth", category = "stock" },
  { id = "en:fond", category = "stock" },
  { id = "en:koji", category = "fermented" },
  { id = "en:alcohol", category = "alcohol" },
  { id = "en:coffee", category = "beverage" },
  { id = "en:tea", category = "beverage" },
  { id = "en:juice", category = "beverage" },
  { id = "en:soft-drink", category = "beverage" },
  { id = "en:water", category = "beverage" },
]
# Subtrees dropped even inside an included one: label and processing
# artefacts rather than things a cook buys.
exclude_subtrees = [
  "en:flavouring",
  "en:extract",
  "en:concentrate",
  "en:protein",
  "en:fiber",
  "en:preparation",
  "en:coating",
  "en:filling",
  "en:enzyme",
  "en:ferment",
  "en:prebiotics",
  "en:varietal",
  "en:essential-oil",
  "en:collagen",
  "en:casing",
  "en:smoke",
  "en:scalding",
  "en:wort",
]

# Patterns over the English canonical id (without `en:`), each a class.
[[select.exclude]]
name = "additive codes"
pattern = "^e[0-9]{3,4}[a-z]?(-|$)"

[[select.exclude]]
name = "flavourings and aromas"
pattern = "(^|-)(flavou?rs?|flavou?rings?|flavou?red|aromas?|aromatic-preparation)(-|$)"

[[select.exclude]]
name = "extracts, concentrates, isolates"
pattern = "(^|-)(extracts?|concentrates?|concentrated|isolates?|hydroly[sz]ed|hydroly[sz]ates?|modified|derivatives?)(-|$)"

[[select.exclude]]
name = "component fractions"
pattern = "(^|-)(solids|fibres?|fibers?|proteins?|lecithins?|caseinates?|whey-permeate|permeate)(-|$)"

[[select.exclude]]
name = "preparations and mixtures"
pattern = "(^|-)(preparations?|mixtures?|blends?|fillings?|coatings?|glazes?|in-variable-proportions?|variable-proportions?)(-|$)"

[[select.exclude]]
name = "percentages and grades"
pattern = "(%|(^|-)[0-9]+([.,-][0-9]+)?-?(percent|pct)(-|$)|(^|-)(category|class|grade)-[a-z0-9]+(-|$))"

[[select.exclude]]
name = "origin labels"
pattern = "(^|-)(from|of-origin|origin)-"

[[select.exclude]]
name = "certification and treatment labels"
pattern = "(^|-)(organic|bio|pasteuri[sz]ed|uht|sterili[sz]ed|irradiated|reconstituted|refrigerated|deep-frozen|non-gmo|gmo-free)(-|$)"

