# Crisp ingredient index — import rules.
#
# Every decision here applies to a CLASS of source entries (a subtree, a name
# pattern, a match kind). Decisions about a single entry belong only in
# overrides/. To change the index, edit a rule or an override and run
# `just ingredients`; never edit spec/ingredients/ by hand.
# See docs/ingredient-index.md.

