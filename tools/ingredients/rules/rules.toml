# ---- density ----------------------------------------------------------------

[density]
# Match kinds accepted, best first: the taxonomy's own density, a USDA food
# the taxonomy links, a one-segment USDA description equal to a name.
# `fuzzy` (same words) candidates are recorded for review but not accepted.
accept = ["off", "linked", "exact"]
denominator = 100

