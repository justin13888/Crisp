# Production stack for a single host: crisp-server and PostgreSQL.
#
# Read docs/deployment.md before using this file. In short:
#
#   sudo install -d -m 0700 /etc/crisp
#   sudo install -m 0600 /dev/null /etc/crisp/crisp.env   # then fill it in
#   docker compose -f compose.prod.yaml --env-file /etc/crisp/crisp.env up -d --build
#
# Every secret comes from the --env-file through variable interpolation, so
# each container receives only the values it needs: PostgreSQL never sees the
# platform seed, and nothing is committed to the repository. Interpolation
# fails fast (`:?`) when a required value is missing.
#
# Differences from the development compose.yaml:
# - no fixed credentials; the database password is required;
# - PostgreSQL is not published on any host port, only on the internal network;
# - the server listens on 127.0.0.1 only, for a TLS reverse proxy on the host;
# - containers restart on failure and rotate their logs;
# - the server runs read-only with no capabilities and no-new-privileges
#   (PostgreSQL keeps its image defaults: its entrypoint needs to switch user).

name: crisp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Pinned to a major version: a major upgrade needs pg_dump/pg_restore or
    # pg_upgrade, never just a new tag (docs/deployment.md, "Upgrades").
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crisp
      POSTGRES_DB: crisp
      POSTGRES_PASSWORD: ${CRISP_POSTGRES_PASSWORD:?set CRISP_POSTGRES_PASSWORD in the env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisp -d crisp"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  server:
    image: ${CRISP_IMAGE:-crisp-server:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      CRISP_DATABASE_URL: postgresql://crisp:${CRISP_POSTGRES_PASSWORD:?set CRISP_POSTGRES_PASSWORD in the env file}@postgres:5432/crisp
      CRISP_PLATFORM_SEED: ${CRISP_PLATFORM_SEED:?set CRISP_PLATFORM_SEED in the env file}
      # A public server names the web app's origin(s); the lenient "any
      # origin" default is for development only.
      CRISP_ALLOWED_ORIGINS: ${CRISP_ALLOWED_ORIGINS:?set CRISP_ALLOWED_ORIGINS in the env file}
      CRISP_MAX_BUNDLE_BYTES: ${CRISP_MAX_BUNDLE_BYTES:-16777216}
      # Unset (empty) runs one verification per available CPU.
      CRISP_VERIFY_CONCURRENCY: ${CRISP_VERIFY_CONCURRENCY:-}
      CRISP_SESSION_TTL_SECS: ${CRISP_SESSION_TTL_SECS:-2592000}
      # Storage quotas; unset (empty) keeps the server's default, and an
      # unset CRISP_MAX_STORED_BYTES means no server-wide cap.
      CRISP_QUOTA_BYTES_PER_ACCOUNT: ${CRISP_QUOTA_BYTES_PER_ACCOUNT:-}
      CRISP_QUOTA_BUNDLES_PER_ACCOUNT: ${CRISP_QUOTA_BUNDLES_PER_ACCOUNT:-}
      CRISP_MAX_STORED_BYTES: ${CRISP_MAX_STORED_BYTES:-}
      # The reverse proxy's address as the server sees it (the gateway of
      # this file's backend network), so the per-client rate limits count
      # the client the proxy forwards rather than the proxy itself. Unset
      # (empty) trusts nobody (docs/deployment.md, "Client addresses behind
      # the proxy").
      CRISP_TRUSTED_PROXIES: ${CRISP_TRUSTED_PROXIES:-}
      CRISP_PROXY_HEADER: ${CRISP_PROXY_HEADER:-}
      # Listener limits; unset (empty) keeps the server's default.
      CRISP_HEADER_TIMEOUT_SECS: ${CRISP_HEADER_TIMEOUT_SECS:-}
      CRISP_BODY_IDLE_TIMEOUT_SECS: ${CRISP_BODY_IDLE_TIMEOUT_SECS:-}
      CRISP_MAX_CONNECTIONS: ${CRISP_MAX_CONNECTIONS:-}
      CRISP_MAX_STREAMS_PER_CONNECTION: ${CRISP_MAX_STREAMS_PER_CONNECTION:-}
      # Abuse budgets, each REQUESTS/SECONDS. Unset (empty) keeps the server's
      # built-in default. The client-keyed budgets (register, challenge per
      # client, login, query) count real clients only once
      # CRISP_TRUSTED_PROXIES names the proxy; until then they are one limit
      # shared by everyone (docs/deployment.md).
      CRISP_LIMIT_REGISTER: ${CRISP_LIMIT_REGISTER:-}
      CRISP_LIMIT_CHALLENGE: ${CRISP_LIMIT_CHALLENGE:-}
      CRISP_LIMIT_CHALLENGE_PEER: ${CRISP_LIMIT_CHALLENGE_PEER:-}
      CRISP_LIMIT_LOGIN: ${CRISP_LIMIT_LOGIN:-}
      CRISP_LIMIT_PUBLISH: ${CRISP_LIMIT_PUBLISH:-}
      CRISP_LIMIT_QUERY: ${CRISP_LIMIT_QUERY:-}
      # Moderation (docs/public-server-policy.md §4): the administrator
      # accounts, and the abuse contact and terms GET /server-info
      # advertises. A public server sets all three.
      CRISP_ADMIN_USR_IDS: ${CRISP_ADMIN_USR_IDS:-}
      CRISP_ABUSE_CONTACT: ${CRISP_ABUSE_CONTACT:-}
      CRISP_TERMS_URL: ${CRISP_TERMS_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
      # `text` (the default) or `json`, one object per event.
      CRISP_LOG_FORMAT: ${CRISP_LOG_FORMAT:-}
      # The metrics listener, reachable from outside the container so the
      # port below can publish it; `off` disables it (docs/deployment.md,
      # "Observability").
      CRISP_METRICS_BIND_ADDR: ${CRISP_METRICS_BIND_ADDR:-0.0.0.0:9464}
    ports:
      # Loopback only: terminate TLS in a reverse proxy on the host and proxy
      # to this port. Never publish it on a public interface.
      - "127.0.0.1:${CRISP_HTTP_PORT:-8080}:8080"
      # Metrics, for a scraper on the host; unauthenticated, so loopback only
      # and never routed through the reverse proxy.
      - "127.0.0.1:${CRISP_METRICS_PORT:-9464}:9464"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    # The same probe as the image's HEALTHCHECK, repeated because Podman
    # builds OCI images by default, and the OCI format drops HEALTHCHECK.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /api/v1/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  backend: {}

volumes:
  postgres_data: {}
