name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  file-size:
    name: File size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - name: Gate tests
        run: just file-size-test
      - name: File size
        run: just file-size

  rust:
    name: Rust workspace (core + server + wasm)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crisp
          POSTGRES_PASSWORD: crisp
          POSTGRES_DB: crisp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crisp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRISP_TEST_DATABASE_URL: postgresql://crisp:crisp@localhost:5432/crisp
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel and components.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the compliance-suite and OpenAPI-contract freshness tests,
      # and the PostgreSQL tests against the service above.
      - name: Test
        run: cargo test --workspace

  mutants:
    name: Mutation testing (changed Rust)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crisp
          POSTGRES_PASSWORD: crisp
          POSTGRES_DB: crisp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crisp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRISP_TEST_DATABASE_URL: postgresql://crisp:crisp@localhost:5432/crisp
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the target branch must be reachable.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-mutants
      - name: Mutants in the diff
        run: just mutants "origin/${{ github.base_ref }}"
      - name: Report what was covered
        if: always()
        run: |
          {
            echo "## Mutation testing"
            if [ ! -d mutants.out ]; then
              echo "No Rust changes in this pull request: nothing was mutated."
              exit 0
            fi
            for outcome in caught missed timeout unviable; do
              echo "- ${outcome}: $(wc -l < "mutants.out/${outcome}.txt" 2>/dev/null || echo 0)"
            done
            for outcome in missed timeout; do
              if [ -s "mutants.out/${outcome}.txt" ]; then
                echo
                echo "### ${outcome}"
                echo '```'
                cat "mutants.out/${outcome}.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

  wasm:
    name: Client engine (crisp-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (the version Cargo.lock pins)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: taiki-e/install-action@just
      - name: Lint (wasm32)
        run: cargo clippy -p crisp-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Test under Node
        run: just wasm-test
      - name: Build
        run: just wasm
      - name: TypeScript declarations are current
        run: git diff --exit-code -- client/src/generated
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-wasm
          path: client/public/crisp-wasm

  client:
    name: Client (TypeScript)
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: crisp-wasm
          path: client/public/crisp-wasm
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun x biome format .
      - name: Lint
        run: bun x biome lint .
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: End-to-end
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report

  coverage:
    name: Coverage (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
