[package]
name = "crisp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Crisp backend: stores, verifies, endorses, and indexes recipe bundles."

[lib]
name = "crisp_server"
path = "src/lib.rs"

[[bin]]
name = "crisp-server"
path = "src/main.rs"

[dependencies]
crisp-core.workspace = true

# HTTP stack — kynos: every route, body, and error is described in the
# emitted OpenAPI 3.2 contract (`spec/openapi.json`). Built without its
# `http2` and `tls` features: the server speaks plaintext HTTP/1.1 to the
# ingress in front of it and never terminates TLS (docs/deployment.md,
# "Protocol"). Every workspace crate that builds kynos lists the same
# features, so a workspace build cannot unify `http2` back in.
kynos = { version = "0.6.1", default-features = false, features = [
    "openapi32",
    "macros",
    "server",
    "http1",
    "json",
    "trace",
] }

# Storage — PostgreSQL via the SeaORM async ORM and its migration runner.
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "2.0.4", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
async-trait = "0.1"

ciborium.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
eyre.workspace = true
color-eyre.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
rand = "0.10.3"
hex = "0.4"
sha2.workspace = true
# Per-endpoint abuse limits: an in-process, keyed GCRA limiter (`limits`).
governor = { version = "0.10", default-features = false, features = [
    "std",
    "dashmap",
] }
# Operational metrics (`metrics`): an owned registry, encoded as OpenMetrics
# text for Prometheus on the separate metrics listener.
prometheus-client = "0.25"

[dev-dependencies]
kynos = { version = "0.6.1", default-features = false, features = [
    "openapi32",
    "macros",
    "server",
    "http1",
    "json",
    "trace",
    "test-util",
] }
# A request body that never arrives (`tests/tour`): the Stream kynos's
# `TestRequest::body_stream` takes, and a paused clock to reach its 408.
bytes = "1.12.1"
futures-core = "0.3.34"
tokio = { workspace = true, features = ["test-util"] }
