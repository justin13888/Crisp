[workspace]
resolver = "3"
members = ["core", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Shared dependency versions — pinned once so `core` and `server` stay in lockstep.
[workspace.dependencies]
crisp-core = { path = "core" }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
bech32 = "0.11.1"
ciborium = "0.2.2"
color-eyre = "0.6.5"
sha2 = "0.10.9"
eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
unicode-normalization = "0.1.24"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
