[package]
name = "crisp-core"
version.workspace = true
edition.workspace = true
description = "The Crisp recipe bundle format engine: canonical CBOR codec, post-quantum crypto, identity derivation, and the verification pipeline."

[dependencies]
argon2.workspace = true
bech32.workspace = true
ciborium.workspace = true
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = "2.2.0"
getrandom = { version = "0.4", features = ["sys_rng"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
zeroize = { version = "1.8.2", features = ["derive"] }


[dev-dependencies]
serde_json = { workspace = true }

# On wasm32, the random-number backend is the browser's crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["sys_rng", "wasm_js"] }
